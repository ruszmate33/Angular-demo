@if (isAddingTask) {
<app-new-task
  [userId]="userId"
  (close)="onCancelAddTask()"
></app-new-task>
}

<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <button (click)="onStartAddNewTask()">Add Tasks</button>
  </header>

  <ul>
    @for (task of selectedUserTasks; track task.id) {
    <li>
      <app-task [task]="task" />
    </li>
    }
  </ul>
</section>
